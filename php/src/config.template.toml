host_url = "https://your-domain.com/reticulum"

[storage]
# "mysql" or "sqlite". SQLite keeps the node in one file, sqlite_path
# (default var/reticulum-php.sqlite, under the web directory: keep var/
# refused there, see README). Switching starts on that database as it is;
# the other one is left untouched, so switching back finds it as it was.
backend = "mysql"
# sqlite_path = "/home/you/reticulum-data/node.sqlite"
mysql_host = "127.0.0.1"
mysql_port = 3306
mysql_dbname = "reticulum_php"
mysql_user = "reticulum_php"
mysql_pass = "YOUR_MYSQL_PASSWORD_HERE"

[http]
idle_exchange_interval_ms = 1000
max_batch_packets = 64
max_packet_bytes = 512

[maintenance]
interface_stale_after_seconds = 15
batch_ttl_seconds = 86400
packet_hash_ttl_seconds = 86400
path_request_tag_ttl_seconds = 86400
reverse_path_ttl_seconds = 480
link_transport_ttl_seconds = 900
inbound_packet_ttl_seconds = 3600
outbound_packet_ttl_seconds = 86400

# Payload-length guard on the two packet tables. Cheap, but it counts only the
# base64 columns — not indexes, row overhead, or the batch/path tables. Treat it
# as a first line of defence, not as the disk cap.
packet_storage_max_bytes = 300000000

# Total disk Reticulum-php may occupy: every table it owns plus its log files.
# This is the cap that actually bounds the hosting account. 0 disables it.
storage_max_bytes = 300000000
storage_log_max_bytes = 16000000
storage_check_interval_seconds = 60
storage_prune_max_rows_per_pass = 200000
# Rows younger than this are never pruned by the budget, at any pressure.
storage_prune_min_age_seconds = 300
# Absolute ceiling on an undelivered outbound packet. TTL expiry only removes
# acknowledged rows, so without this a peer that stops acking pins its queue.
outbound_pending_max_age_seconds = 86400
# Reclaiming space means rebuilding the table (InnoDB frees pages to the
# tablespace, not to the filesystem). Only `php index.php once` does this.
# MySQL only: SQLite reuses its freed pages and is never rebuilt.
storage_reclaim_min_free_bytes = 64000000
storage_reclaim_min_interval_seconds = 3600

[transport]
rns_mtu = 500
pathfinder_max_hops = 128
path_expiry_default_seconds = 604800
path_expiry_access_point_seconds = 86400
path_expiry_roaming_seconds = 21600
max_random_blobs = 64

[swoole]
# Which server answers this node: false = index.php under Apache; true = the
# Swoole entry (swoole_server.php), a resident process Passenger starts
# behind Apache. `php index.php runtime` (deploy.sh runs it) routes Apache
# accordingly and checks /health's runtime.server. Other settings: see the
# top of swoole_server.php.
enable_swoole = false
# workers = 4

[registration]
enforce_signed_registration = false   # browsers only. James turns it on, on a date he sets.

[admin]
# The admin page, <host_url>/admin, answers 404 until someone on the host runs
# `php index.php admin-setup <username>`, which keeps the username and a bcrypt
# hash of the password in ~/.reticulum-post/admin.json, outside the web root.
# Set credentials_file only if the web server cannot see that home directory;
# it must be an absolute path outside public_html.
# credentials_file = "/home/you/.reticulum-post/admin.json"

[interfaces]

[[YourPeerName]]
type = PostInterface
enabled = yes
node_url = "https://peer-domain.com/reticulum"
wake_url = "https://your-domain.com/reticulum/v1/wake"
bitrate = 62500
mtu = 500

[storage]
log_path = "var/router.log"
